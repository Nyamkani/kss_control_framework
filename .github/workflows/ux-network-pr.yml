name: KCF UX Network PR validation
on:
  push:
    branches:
      - feature/ux-remote-action-status-modes
      - feature/ux-topic-default-open
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build Gateway and Action tests
        run: cmake --build build --parallel 4 --target kcf_gateway kcf_gateway_test kcf_gateway_topic_policy_test kcf_control_action_test kcf_gateway_lifecycle_test kcf_gateway_topic_rate_test
      - name: Gateway command help
        run: ./build/gateway/kcf_gateway --help
      - name: Gateway unit/config tests
        run: |
          timeout 120s ./build/gateway/kcf_gateway_test
          timeout 120s ./build/gateway/kcf_gateway_topic_policy_test
          timeout 120s ./build/gateway/kcf_gateway_lifecycle_test
          timeout 120s ./build/gateway/kcf_gateway_topic_rate_test
      - name: Remote Action integration
        run: timeout 120s ./build/examples/network/kcf_control_action_test
